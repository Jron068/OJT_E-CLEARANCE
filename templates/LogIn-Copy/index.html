<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repository System â€” Login</title>
  <link rel="stylesheet"
      href="{{ url_for('static', filename='LogIn-Copy/style.css') }}">

</head>
<body>

  <div class="container">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand">
       <div class="logo">
            <img class="login-logo"
                src="{{ url_for('static', filename='LogIn-Copy/img/dci logo.jpg') }}"
                alt="DCI Logo">

            <img class="login-logo"
                src="{{ url_for('static', filename='LogIn-Copy/img/ccc logo.jpg') }}"
                alt="City College of Calamba Logo">
        </div>
        <p class="tagline"> <b>Document &amp; Repository Management</b></p>
      </div>
    </div>

    <div class="form-card">
      <div class="form-border">
        <!-- Form -->
        <form id="loginForm" novalidate>

          <div class="form-group" id="group-username">
            <label for="username">Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
              </svg>
              <input type="email" id="username" name="username"
                    placeholder="Enter your email"
                    autocomplete="username" required/>

            </div>
            <span class="error-msg" id="error-username"></span>
          </div>

          <div class="form-group" id="group-password">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="password" name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password" required 
                    />
              <button type="button" class="toggle-password" id="togglePassword"
                      aria-label="Show password">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="error-msg" id="error-password"></span>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span class="checkmark"></span>
              Remember me
            </label>
           <a href="{{ url_for('forgot_password_route') }}" class="forgot-link">
              Forgot password?
          </a>
          </div>

          <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83
                        M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </span>
          </button>

          <div class="alert" id="loginAlert" hidden></div>
        </form>
          </div>
      </div>
  </div>

  <script src="{{ url_for('static', filename='LogIn-Copy/script.js') }}"></script>
</body>
</html>
