<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forms | OJT Student Portal</title><link rel="stylesheet" href="{{ url_for('static', filename='student_copy/css/portal-overrides.css') }}"></head>
<body><a class="sr-only skip-link" href="#mainContent">Skip to main content</a><div class="app-layout"><div id="sidebarContainer"></div><div class="main-wrapper"><div id="topbarContainer"></div><main class="page-content" id="mainContent"><div class="page-header"><h1 class="page-header__title">OJT Forms</h1><p class="page-header__sub">Open or download the forms required for your OJT.</p></div><div class="card"><div class="forms-list" id="studentFormsList" role="list" aria-label="Available OJT forms">
{% for form in forms %}<div class="form-item" role="listitem"><div><strong>OJT Form {{ form.number }}</strong></div><a class="btn btn-outline btn--sm" href="{{ url_for('static', filename='student_copy/forms/' ~ form.filename) }}" target="_blank" rel="noopener">Open PDF</a><a class="btn btn-teal btn--sm" href="{{ url_for('static', filename='student_copy/forms/' ~ form.filename) }}" download>Download</a></div>
{% else %}<p class="form-hint">No OJT forms are available right now.</p>{% endfor %}</div></div></main></div></div><script src="{{ url_for('static', filename='student_copy/js/app.js') }}"></script><script src="{{ url_for('static', filename='student_copy/js/forms.js') }}"></script></body></html>
