<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OJT Information | OJT Student Portal</title><link rel="stylesheet" href="{{ url_for('static', filename='student_copy/css/portal-overrides.css') }}"></head>
<body><a class="sr-only skip-link" href="#mainContent">Skip to main content</a><div class="app-layout"><div id="sidebarContainer"></div><div class="main-wrapper"><div id="topbarContainer"></div><main class="page-content" id="mainContent"><div class="page-header"><h1 class="page-header__title">OJT Information</h1><p class="page-header__sub">Enter and save your training details.</p></div>

</div></div><div class="form-actions"><button type="button" class="btn btn-outline" id="resetBtn">Reset</button><button type="submit" class="btn btn-accent">Save Changes</button></div></form>
</main></div></div><script src="{{ url_for('static', filename='student_copy/js/app.js') }}"></script><script src="{{ url_for('static', filename='student_copy/js/ojt-info.js') }}"></script></body></html>
