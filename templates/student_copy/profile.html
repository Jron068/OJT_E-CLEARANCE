<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Profile | OJT Student Portal</title><link rel="stylesheet" href="{{ url_for('static', filename='student_copy/css/portal-overrides.css') }}"></head>
<body><a class="sr-only skip-link" href="#mainContent">Skip to main content</a><div class="app-layout"><div id="sidebarContainer"></div><div class="main-wrapper"><div id="topbarContainer"></div><main class="page-content" id="mainContent"><div class="page-header"><h1 class="page-header__title">My Profile</h1></div>
<div style="display:grid;grid-template-columns:minmax(180px,220px) 1fr;gap:20px;align-items:start"><div class="photo-block"><div class="photo-avatar" id="avatarPreview" aria-label="Profile photo"></div><p class="photo-name" id="avatarName">Student</p><p class="photo-role">OJT Student</p><label class="btn btn-outline btn--sm" for="photoInput">Change Photo</label><input type="file" id="photoInput" accept="image/*" class="sr-only"></div><div>
<form class="form-section" id="personalForm"><div class="form-section__head"><h2 class="form-section__title">Personal Information</h2></div><div class="form-section__body"><div class="form-grid">
<div class="form-group"><label class="form-label" for="studentId">Student ID</label><input class="form-control" id="studentId" name="studentId"></div>
<div class="form-group"><label class="form-label" for="fullName">Full Name *</label><input class="form-control" id="fullName" name="fullName" required><span class="form-error" data-err="fullName"></span></div>
<div class="form-group"><label class="form-label" for="email">Email Address *</label><input class="form-control" type="email" id="email" name="email" required readonly><span class="form-error" data-err="email"></span></div>
<div class="form-group"><label class="form-label" for="address">Address</label><input class="form-control" id="address" name="address"></div>
<div class="form-group"><label class="form-label" for="contact">Contact Number</label><input class="form-control" type="tel" id="contact" name="contact"></div>
<div class="form-group"><label class="form-label" for="emergency">Emergency Contact</label><input class="form-control" type="tel" id="emergency" name="emergency"></div>
</div></div><div class="form-actions"><button type="submit" class="btn btn-accent">Save Changes</button></div></form>
<form class="form-section" id="academicForm"><div class="form-section__head"><h2 class="form-section__title">Academic Information</h2></div><div class="form-section__body"><div class="form-grid">
<div class="form-group"><label class="form-label" for="program">Program</label><select class="form-control" id="program" name="program"><option value="">Select program</option><option>BS Information Technology</option><option>BS Computer Science</option><option>BS Information Systems</option></select></div>
<div class="form-group"><label class="form-label" for="yearLevel">Year Level</label><select class="form-control" id="yearLevel" name="yearLevel"><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>
</div></div><div class="form-actions"><button type="submit" class="btn btn-accent">Save Changes</button></div></form>
</div></div></main></div></div><script src="{{ url_for('static', filename='student_copy/js/app.js') }}"></script><script src="{{ url_for('static', filename='student_copy/js/profile.js') }}"></script></body></html>
