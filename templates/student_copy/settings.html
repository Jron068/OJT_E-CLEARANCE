<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings | OJT Student Portal</title><link rel="stylesheet" href="{{ url_for('static', filename='student_copy/css/portal-overrides.css') }}"></head>
<body><a class="sr-only skip-link" href="#mainContent">Skip to main content</a><div class="app-layout"><div id="sidebarContainer"></div><div class="main-wrapper"><div id="topbarContainer"></div><main class="page-content" id="mainContent"><div class="page-header"><h1 class="page-header__title">Settings</h1></div>
<form class="form-section" id="accountForm"><div class="form-section__head"><h2 class="form-section__title">Account Information</h2></div><div class="form-section__body"><div class="form-grid"><div class="form-group col-span-2"><label class="form-label" for="username">Username *</label><input class="form-control" id="username" name="username" required><span class="form-error" data-err="username"></span></div><div class="form-group"><label class="form-label" for="recoveryEmail">Recovery Email</label><input class="form-control" type="email" id="recoveryEmail" name="recoveryEmail"></div><div class="form-group"><label class="form-label" for="confirmEmail">Confirm Email</label><input class="form-control" type="email" id="confirmEmail" name="confirmEmail"></div></div></div><div class="form-actions"><button class="btn btn-accent" type="submit">Save Changes</button></div></form>
<form class="form-section" id="passwordForm"><div class="form-section__head"><h2 class="form-section__title">Change Password</h2></div><div class="form-section__body"><div class="form-grid form-grid--1"><div class="form-group"><label class="form-label" for="currentPwd">Current Password *</label><input class="form-control" type="password" id="currentPwd" required autocomplete="current-password"></div><div class="form-group"><label class="form-label" for="newPwd">New Password *</label><input class="form-control" type="password" id="newPwd" required autocomplete="new-password" minlength="9"><span id="pwdStrengthLabel" class="form-hint">At least 9 characters with uppercase, lowercase, and a special character.</span></div><div class="form-group"><label class="form-label" for="confirmPwd">Confirm Password *</label><input class="form-control" type="password" id="confirmPwd" required autocomplete="new-password" minlength="9"></div></div></div><div class="form-actions"><button class="btn btn-accent" type="submit">Update Password</button></div></form>
</main></div></div><script src="{{ url_for('static', filename='student_copy/js/app.js') }}"></script><script src="{{ url_for('static', filename='student_copy/js/settings.js') }}"></script></body></html>
